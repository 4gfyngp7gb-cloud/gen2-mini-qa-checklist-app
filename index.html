<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hardware Hub</title>

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Inter', 'ui-sans-serif', 'system-ui'],
          mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
        },
        colors: {
          graphite: {
            950: '#15181A', 900: '#1B1F22', 800: '#22262A', 700: '#2C3237',
            600: '#3A4147', 500: '#565F66', 400: '#7C858C', 300: '#A6ADB2',
            200: '#CBCFD2', 100: '#E8E9EA',
          },
          leaf: { 500: '#22A559', 600: '#1B8A49' },
        },
      },
    },
  }
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">

<style>
  body { background-color: #15181A; }
  .grid-backdrop {
    background-image: radial-gradient(circle, #2C3237 1px, transparent 1px);
    background-size: 22px 22px;
  }
  .hub-card { transition: border-color 150ms ease, transform 150ms ease; }
  .hub-card:hover { transform: translateY(-2px); }
  .hub-card.disabled:hover { transform: none; }
</style>
</head>

<body class="grid-backdrop min-h-screen font-sans text-graphite-100 antialiased">

  <div class="mx-auto flex min-h-screen max-w-4xl flex-col justify-center px-4 py-6 sm:py-10">

    <div class="mb-10 text-center">
      <p class="font-mono text-xs tracking-wide text-leaf-500">HARDWARE TEAM</p>
      <h1 class="mt-1 text-2xl font-semibold text-graphite-100 sm:text-3xl">Hardware Hub</h1>
      <p class="mt-2 text-sm text-graphite-400">Choose what you'd like to do.</p>
    </div>

    <div class="grid gap-4 sm:grid-cols-2">

      <a href="assembly.html" class="hub-card flex flex-col items-start gap-3 rounded-lg border border-graphite-700 bg-graphite-900/80 p-5 text-left shadow-lg shadow-black/20 hover:border-leaf-500">
        <span class="flex h-10 w-10 items-center justify-center rounded-md bg-leaf-500/15 text-leaf-500">
          <svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path d="M11 3a1 1 0 10-2 0v1a1 1 0 002 0V3zM15.657 5.757a1 1 0 00-1.414-1.414l-.707.707a1 1 0 001.414 1.414l.707-.707zM18 10a1 1 0 01-1 1h-1a1 1 0 110-2h1a1 1 0 011 1zM5.05 6.464A1 1 0 106.464 5.05l-.707-.707a1 1 0 00-1.414 1.414l.707.707zM5 10a1 1 0 01-1 1H3a1 1 0 110-2h1a1 1 0 011 1zM8 16v-1h4v1a2 2 0 11-4 0zM12 14c.015-.34.208-.646.477-.859a4 4 0 10-4.954 0c.27.213.462.519.476.859h4.002z" />
          </svg>
        </span>
        <span class="text-base font-semibold text-graphite-100">Assembly Tracker</span>
        <span class="text-sm text-graphite-400">Which build stage every kiosk is currently in, by serial number.</span>
      </a>

      <a href="qa-dashboard.html" class="hub-card flex flex-col items-start gap-3 rounded-lg border border-graphite-700 bg-graphite-900/80 p-5 text-left shadow-lg shadow-black/20 hover:border-leaf-500">
        <span class="flex h-10 w-10 items-center justify-center rounded-md bg-leaf-500/15 text-leaf-500">
          <svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M2 4a2 2 0 012-2h8a2 2 0 012 2v12l-6-3-6 3V4z" clip-rule="evenodd" />
          </svg>
        </span>
        <span class="text-base font-semibold text-graphite-100">QA Dashboard</span>
        <span class="text-sm text-graphite-400">Submitted inspections, stats, and starting a new QA process.</span>
      </a>

    </div>
  </div>

</body>
</html>
